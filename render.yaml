services:
  - type: web
    name: schoolfees-saas
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: npm run render-start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: development
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DB_PATH
        value: /tmp/school.db
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: REFRESH_EXPIRES_IN
        value: 7d
