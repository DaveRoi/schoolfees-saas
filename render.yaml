services:
  - type: web
    name: schoolfees-saas
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend && rm -rf frontend/node_modules
    startCommand: npm run render-start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/school.db
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: REFRESH_EXPIRES_IN
        value: 7d
