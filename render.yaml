services:
  - type: web
    name: schoolfees-saas
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm run seed --prefix backend && npm start --prefix backend
    healthCheckPath: /api/health
    disk:
      name: schoolfees-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/school.db
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: REFRESH_EXPIRES_IN
        value: 7d
